version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: library_desk_postgres
    restart: always
    environment:
      POSTGRES_DB: library_desk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_desk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library_desk_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/library_desk
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
    driver: local
