spring.application.name=library-desk-test

# H2 In-Memory Database for testing
spring.datasource.url=jdbc:h2:mem:library_desk_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate settings for test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during tests so H2 creates schema from JPA annotations
spring.flyway.enabled=false
